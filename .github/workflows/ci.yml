name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: invoicing_kit_test
        ports:
          - 5544:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      INVOICING_KIT_TEST_DATABASE_URL: postgresql://test:test@localhost:5544/invoicing_kit_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Push Prisma fixture schema
        working-directory: packages/invoicing-kit
        run: bun run db:push

      - name: Typecheck
        run: bun run --filter '*' typecheck

      - name: Test
        run: bun run --filter '*' test

      - name: Build
        run: bun run --filter '*' build
